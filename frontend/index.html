<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>frontend</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #17161B;
        z-index: 9999;
      }
      #initial-loader .spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #DCAC5B;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      #initial-loader .label {
        font-family: Shabnam, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
      }
      @media (prefers-color-scheme: light) {
        #initial-loader {
          background: #FAF9F6;
        }
        #initial-loader .spinner {
          border: 3px solid rgba(32, 30, 27, 0.12);
          border-top-color: #A2712A;
        }
        #initial-loader .label {
          color: rgba(32, 30, 27, 0.65);
        }
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="label">در حال بارگذاری...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
