<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سامانه جامع مدیریت املاک</title>
    <meta name="theme-color" content="#090d16" />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #090d16;
        z-index: 9999;
      }
      #initial-loader .spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #10b981;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      #initial-loader .label {
        font-family: "Vazirmatn FD", Tahoma, sans-serif;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
      }
      @media (prefers-color-scheme: light) {
        #initial-loader {
          background: #f1f5f9;
        }
        #initial-loader .spinner {
          border: 3px solid rgba(15, 23, 42, 0.12);
          border-top-color: #059669;
        }
        #initial-loader .label {
          color: rgba(15, 23, 42, 0.65);
        }
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="label">در حال بارگذاری...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
